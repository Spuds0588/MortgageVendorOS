name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }} — test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build + test (includes edge-compat guard)
        run: npm test

  # Verify the packed tarball installs and imports cleanly as a consumer would.
  package-smoke:
    name: Package smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack and install into a scratch project
        run: |
          npm pack --silent
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/mortgage-vendor-os-*.tgz --silent
          node --input-type=module -e "
            import { MortgageVendorOS, MockProvider } from '/tmp/consumer/node_modules/mortgage-vendor-os/dist/index.js';
            const os = new MortgageVendorOS();
            os.use('APPRAISAL', new MockProvider());
            const order = await os.order('APPRAISAL', { address: '123 Main St' });
            let status;
            for (let i = 0; i < 5; i++) {
              status = await os.status('APPRAISAL', order.vendorOrderId);
              if (status.isComplete) break;
            }
            if (!status.isComplete) throw new Error('expected complete after polling');
            const docs = await os.documents('APPRAISAL', order.vendorOrderId);
            if (docs.downloadUrls.length < 1) throw new Error('expected documents once complete');
            console.log('consumer lifecycle OK:', order.vendorOrderId);
          "
